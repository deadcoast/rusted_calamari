[package]
name = "rusted-calamari"
version = "0.3.0"
edition = "2024"
description = "Retro image browser and organizer with the Octobrachial Tree view"

[lib]
name = "octo"
path = "src/lib.rs"

[[bin]]
name = "rusted-calamari"
path = "src/main.rs"

[[bin]]
name = "calamari-workspace-smoke"
path = "src/smoke_main.rs"
required-features = ["workspace-smoke"]
test = false

[features]
workspace-smoke = []

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
image = "0.25"
rfd = "0.17"
egui-phosphor = { version = "0.14", default-features = false, features = ["bold", "fill"] }
serde = { version = "1", features = ["derive"] }

# The screen's work area (minus the taskbar), for image focus.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 3
